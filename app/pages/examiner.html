<!DOCTYPE html>
<html lang="nl">
    <head>
        <meta charset="utf-8">
        <title>Administratie | Dictee | DJO Amersfoort</title>
        <link rel="icon" href="https://aanmelden.djoamersfoort.nl/static/img/logo.png" type="image/x-icon">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <link rel="stylesheet" href="/static/css/index.css" type="text/css">
    </head>
    <body>
        <div class="container Examiner">
            <div class="heading">
                <div class="logo">
                    <img src="https://aanmelden.djoamersfoort.nl/static/img/logo.png" alt="Logo DJO">
                    <h1>Administratie</h1>
                </div>
                <a href="/">Terug naar homepage</a>
            </div>

            <div class="card Contents">
                <h3 class="flex">
                    <span>Rondes</span>
                    <span class="round-add">
                        <button id="round-add-dictee" class="main-bg small">
                            <span>+ Dictee</span>
                        </button>
                        <button id="round-add-topo" class="main-bg small">
                            <span>+ Topo</span>
                        </button>
                        <button id="round-add-rekenen" class="main-bg small">
                            <span>+ Rekenen</span>
                        </button>
                        <button id="round-add-circuit" class="main-bg small">
                            <span>+ Arduino</span>
                        </button>
                    </span>
                </h3>
                <div>
                    <div class="rounds-layout">
                        <div id="round-list"></div>
                        <div id="round-editor"></div>
                    </div>
                    <p id="dictee-contents-status">&nbsp;</p>
                    <button id="dictee-save" class="main-bg">
                        <span>Opslaan</span>
                        <img src="/static/icons/save.svg" class="img-r">
                    </button>
                </div>
            </div>

            <div class="card Participants">
                <h3>Kandidatenlijst</h3>
                <div id="participant-list"></div>
                <div id="no-participants">
                    <img src="/static/icons/meh.svg" alt="Meh">
                    <p>Er zijn (nog) geen kandidaten.</p>
                </div>
            </div>

            <div class="card Dashboard">
                <h3>Dashboard</h3>
                <div id="dashboard-items">
                    <div>
                        <h2>Status:<br><span id="dictee-state"></span></h2>
                        <button id="state-to-closed" class="red-bg small">
                            <span>Afsluiten</span>
                            <img src="/static/icons/x.svg" alt="Close" class="img-r">
                        </button>
                        <button id="state-to-open" class="green-bg small">
                            <span>Starten!</span>
                            <img src="/static/icons/arrow-right.svg" alt="Start" class="img-r">
                        </button>
                        <button id="state-to-busy" class="main-bg small">
                            <span>Vrijgeven!</span>
                            <img src="/static/icons/arrow-right.svg" alt="Free" class="img-r">
                        </button>
                        <button id="state-to-ended" class="main-bg small" title="Iedereen moet inleveren, de uitslagen blijven bewaard">
                            <span>Beëindigen</span>
                            <img src="/static/icons/check-circle.svg" alt="End" class="img-r">
                        </button>
                    </div>
                    <div id="round-control" style="display: none">
                        <div class="round-control-info">
                            <h2>Ronde <span id="live-round-number"></span></h2>
                            <p id="live-round-title"></p>
                            <p id="live-round-done"></p>
                        </div>
                        <div class="round-control-buttons">
                            <button id="live-round-prev" class="main-bg small" title="Vorige ronde">
                                <img src="/static/icons/arrow-right.svg" alt="Vorige ronde" class="img-r rot180">
                            </button>
                            <button id="live-round-next" class="main-bg small" title="Volgende ronde">
                                <span>Volgende</span>
                                <img src="/static/icons/arrow-right.svg" alt="Volgende ronde" class="img-r">
                            </button>
                        </div>
                    </div>
                    <div>
                        <h2>Lichtkrant API</h2>
                        <button id="lichtkrant-api-on" class="green-bg small">
                            <span>Aan</span>
                            <img src="/static/icons/terminal.svg" alt="API on" class="img-r">
                        </button>
                        <button id="lichtkrant-api-off" class="main-bg small">
                            <span>Uit</span>
                            <img src="/static/icons/terminal.svg" alt="API off" class="img-r">
                        </button>
                    </div>
                </div>
            </div>

            <div class="footer">
                <p>
                    <span id="version"></span>
                    | DJO Dictee op <a href="https://github.com/djoamersfoort/dictee" target="_blank">GitHub</a>
                    | Met trots gemaakt door <a href="https://github.com/ngkon6" target="_blank">ngkon</a>
                </p>
            </div>
        </div>

        <div id="overlay">
            <div class="dialog">
                <div id="inspector">
                    <h1>Dictee van <span id="comparison-name" class="main-fg"></span></h1>
                    <h4 id="comparison-score"></h4>
                    <div id="inspector-rounds"></div>
                    <button id="inspector-close" class="main-bg small">
                        <span>Sluiten</span>
                        <img src="/static/icons/x.svg" alt="Close" class="img-r">
                    </button>
                </div>
            </div>
        </div>

        <div class="sonner">
            <img id="sonner-icon">
            <span id="sonner-text"></span>
        </div>

        <script src="/static/js/general.js"></script>
        <script src="/static/js/dialog.js"></script>
        <script src="/static/js/sonner.js"></script>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="/static/js/topo.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@wokwi/elements@1.9.1/dist/wokwi-elements.bundle.min.js"></script>
        <script src="/static/js/examiner.js" type="module"></script>
        <noscript>
            <div class="dialog">
                <h1>Ho even!</h1>
                <h3>Je hebt geen JavaScript ingeschakeld!<br>
                  Schakel JavaScript eerst in om deze site te bekijken.</h3>
            </div>
        </noscript>
        <div id="too-small" class="dialog">
            <h1>Oei!</h1>
            <h3>Je scherm is iets te klein.<br>
              Maak je scherm groter om door te gaan.</h3>
        </div>
    </body>
</html>
